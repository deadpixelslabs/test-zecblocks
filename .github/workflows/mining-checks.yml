name: Mining checks
on:
  push:
    branches: [main, codex/mining-studio]
  pull_request:
permissions:
  contents: read
jobs:
  mining:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify proxy, wallet recovery, mining and UI
        run: |
          node _syntax_check.js
          sha256sum -c SHA256SUMS.txt
          node --test tests/mining.test.cjs
          node --test tests/claim-chain-cache.cjs
      - name: Save UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mining-ui
          path: test-artifacts/
          if-no-files-found: ignore
  live-read-check:
    if: github.ref == 'refs/heads/main'
    needs: mining
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed canonical reads
        run: node tests/live-read-check.cjs
